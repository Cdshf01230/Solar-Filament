<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 268" width="1000" height="268" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><title id="t">Baseline: semantic head and connected components</title><desc id="d">H-alpha image, frozen ConvNeXt-B semantic head on 768 px tiles, threshold chosen on quick74, 8-connected components of at least 8 px, one instance per component. Failure modes: a faint section splits one filament; a bridge of false pixels merges two.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker></defs><path d="M173 21 V14 H301.125 M445.875 14 H574 V21" fill="none" stroke="#8c959f" stroke-width="1.2"/>
<text x="373.5" y="18.5" font-size="12.5" fill="#59636e" text-anchor="middle" font-weight="600">Pixel classification</text>
<path d="M625 21 V14 H738.25 M882.75 14 H996 V21" fill="none" stroke="#8c959f" stroke-width="1.2"/>
<text x="810.5" y="18.5" font-size="12.5" fill="#59636e" text-anchor="middle" font-weight="600">Pixels to instances</text>
