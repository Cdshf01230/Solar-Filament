<text x="488.0" y="109.5" font-size="12.5" fill="#59636e" text-anchor="middle">to binary mask</text>
<text x="488.0" y="126.5" font-size="12.5" fill="#cf222e" text-anchor="middle" font-weight="600">chosen on quick74</text>
<rect x="625" y="40" width="160" height="104" rx="10" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.6"/>
<text x="705.0" y="79.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">Components</text>
