<text x="63.0" y="101.0" font-size="12.5" fill="#59636e" text-anchor="middle">full disk</text>
<text x="63.0" y="118.0" font-size="12.5" fill="#59636e" text-anchor="middle">2048 × 2048</text>
<rect x="173" y="40" width="178" height="104" rx="10" fill="#e9f7ef" stroke="#1a7f37" stroke-width="1.6"/>
<text x="262.0" y="62.0" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">Semantic head</text>
<text x="262.0" y="84.0" font-size="12.5" fill="#59636e" text-anchor="middle">frozen ConvNeXt-B</text>
<text x="262.0" y="101.0" font-size="12.5" fill="#59636e" text-anchor="middle">FPN · U-Net · DDP-mini</text>
<text x="262.0" y="118.0" font-size="12.5" fill="#59636e" text-anchor="middle">9 tiles, Hann blend</text>
<text x="262.0" y="135.0" font-size="12.5" fill="#1a7f37" text-anchor="middle" font-weight="600">1.6–2.1 M trainable</text>
<rect x="402" y="40" width="172" height="104" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6"/>
